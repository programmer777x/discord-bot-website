<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuMiBot - Features & Documentation</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            discord: '#5865F2',
            darkBg: '#0F172A',
            cardBg: 'rgba(30, 41, 59, 0.7)',
            accentCyan: '#06B6D4',
          }
        }
      }
    }
  </script>
  
  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom styling for dynamically loaded Markdown elements */
    #markdown-content h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
    }
    #markdown-content h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    #markdown-content h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #94a3b8;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    #markdown-content p {
      color: #cbd5e1;
      line-height: 1.625;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    #markdown-content ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 1.25rem;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    #markdown-content li {
      margin-bottom: 0.375rem;
    }
    #markdown-content hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 2rem 0;
    }
    #markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem 0;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #markdown-content th {
      background: rgba(88, 101, 242, 0.15);
      color: #5865F2;
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    #markdown-content td {
      padding: 0.75rem 1rem;
      color: #e2e8f0;
      font-size: 0.875rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    #markdown-content tr:last-child td {
      border-bottom: none;
    }
    #markdown-content code {
      background: #1e293b;
      color: #38bdf8;
      padding: 0.2rem 0.4rem;
      border-radius: 0.375rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
    }
    #markdown-content pre {
      background: #020617;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-x: auto;
      margin: 1rem 0 1.5rem 0;
    }
    #markdown-content pre code {
      background: transparent;
      padding: 0;
      color: #f1f5f9;
    }
  </style>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Navigation -->
  <nav class="sticky top-0 z-50 glass-card border-b border-slate-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-discord flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-discord/30">
            <i class="fa-solid fa-robot"></i>
          </div>
          <span class="text-xl font-bold tracking-wide text-white">LuMi<span class="text-discord">Bot</span></span>
        </a>
      </div>
      <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
        <a href="index.html" class="hover:text-discord transition-colors">Home</a>
        <a href="features.html" class="text-discord font-semibold">Features</a>
        <a href="index.html#commands" class="hover:text-discord transition-colors">Commands</a>
        <a href="index.html#support" class="hover:text-discord transition-colors">Support</a>
      </div>
      <a href="#" class="bg-discord hover:bg-discord/90 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-md shadow-discord/20 flex items-center space-x-2">
        <i class="fa-brands fa-discord"></i>
        <span>Add to Discord</span>
      </a>
    </div>
  </nav>

  <!-- Container for Markdown Content -->
  <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
    <div class="glass-card p-8 md:p-12 rounded-2xl">
      <div id="markdown-content">
        <div class="text-center py-12 text-slate-400">
          <i class="fa-solid fa-spinner animate-spin text-2xl text-discord mb-3"></i>
          <p class="text-sm">Loading feature documentation...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-800/80 bg-slate-900/50 py-8 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center text-sm text-slate-500 gap-4">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-robot text-discord"></i>
        <span class="text-slate-400 font-semibold">LuMiBot</span>
        <span>© 2026. All rights reserved.</span>
      </div>
      <div class="flex space-x-6">
        <a href="#" class="hover:text-slate-300 transition-colors">Privacy Policy</a>
        <a href="#" class="hover:text-slate-300 transition-colors">Terms of Service</a>
        <a href="#" class="hover:text-slate-300 transition-colors">Support Server</a>
      </div>
    </div>
  </footer>

  <!-- Fetch and Render Markdown -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('features.md')
        .then(response => {
          if (!response.ok) {
            throw new Error("HTTP error " + response.status);
          }
          return response.text();
        })
        .then(markdown => {
          document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
        })
        .catch(error => {
          console.error("Error loading features.md:", error);
          document.getElementById('markdown-content').innerHTML = `
            <div class="text-center py-8">
              <p class="text-red-400 font-bold mb-2">Unable to load features documentation.</p>
              <p class="text-slate-400 text-xs">Ensure 'features.md' is placed in the same folder as 'features.html'.</p>
            </div>
          `;
        });
    });
  </script>

</body>
</html>
